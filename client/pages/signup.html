<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WanderQuest - Sign Up</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/signup.css">
</head>

<body>

<div class="login-container">

    <div class="left-panel">

        <img src="../assets/images/login.jpg" alt="Travel Landscape">

        <div class="image-content">
            <h2>WanderQuest</h2>

            <h3>Start Your Journey</h3>

            <p>
                Create your account and begin exploring destinations,
                planning unforgettable trips, and making memories that
                last a lifetime.
            </p>
        </div>

    </div>

    <div class="right-panel">

        <div class="login-card">

            <h1>Create Account</h1>

            <p class="login-subtitle">
                Join WanderQuest and start planning your next adventure.
            </p>

            <form action="/signup" method="POST">

                <label for="fullname">Full Name</label>
                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    placeholder="Enter your full name"
                    required
                >

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <label for="confirm-password">Confirm Password</label>
                <input
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                    placeholder="Confirm your password"
                    required
                >

               <div class="terms">
                    <label>
                        <input type="checkbox" required>
                        <span>
                            I agree to the
                            <a href="#">Terms & Conditions</a>
                        </span>
                    </label>
                </div>

                <button type="submit" class="login-btn">
                    Create Account
                </button>

                <div class="divider">
                    <span>OR</span>
                </div>

                <button type="button" class="google-btn">
                    Continue with Google
                </button>

                <p class="signup-text">
                    Already have an account?
                    <a href="login.html">Sign In</a>
                </p>

            </form>

        </div>

    </div>

</div>
<script type="module" src="../js/main.js"></script>
</body>
</html>
